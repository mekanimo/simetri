[project]
name = "simetri"
version = "0.0.9"
description = "simetri is a Python library for creating and manipulating patterns."
readme = "README.md"
authors = [
    { name = "Fahri Basegmez", email = "mangabasi@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "coloraide; python_version >= '3.11'",
    "colorspace; python_version >= '3.11'",
    "ipykernel>=6.30.1",
    "ipython>=8.18.1",
    "matplotlib>=3.9.4",
    "networkx>=3.2.1",
    "numpy>=2.0.2",
    "pillow>=12.1.1",
    "pymupdf>=1.25.1",
    "pypdf>=5.9.0",
    "scipy>=1.13.1",
    "strenum>=0.4.15",
    "urllib3>=2.6.0",

]

[project.scripts]
simetri = "simetri:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simetri"]
exclude = [
    "src/simetri/gui",
    "src/simetri/ground_rules_files",
    "src/simetri/tests",
    "src/simetri/.vscode",
    "src/simetri/.VSCodeCounter",
    "**/__pycache__",
    "**/*.pyc",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GPLv2 License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Topic :: Computational Geometry :: 2D Symmetry :: Pattern Design",
]

[project.urls]
Homepage = "https://github.com/mekanimo/simetri.graphics"

[tool.ruff]
line-length = 80

[tool.ruff.lint]
ignore = ["F405", "F403", "F401", "F821"]

[tool.ruff.format]
line-ending = "auto"


[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "twine>=6.1.0",
]
